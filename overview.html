        <script type="module">
            // This is reusing snippets of code from the DuckDB Iceberg browser (https://duckdb.org/2025/12/16/iceberg-in-the-browser)

            import * as duckdb from "https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@1.33.1-dev48.0/+esm";

            async function getDb() {
                // @ts-ignore
                if (window._db) return window._db;
                const JSDELIVR_BUNDLES = duckdb.getJsDelivrBundles();
            
                // Select a bundle based on browser checks
                const bundle = await duckdb.selectBundle(JSDELIVR_BUNDLES);
            
                const worker_url = URL.createObjectURL(
                    new Blob([`importScripts("${bundle.mainWorker}");`], {
                        type: "text/javascript",
                    })
                );
            
                // Instantiate the asynchronous version of DuckDB-wasm
                const worker = new Worker(worker_url);

                const logger = new duckdb.ConsoleLogger();
                const db = new duckdb.AsyncDuckDB(logger, worker);

                await db.instantiate(bundle.mainModule, bundle.pthreadWorker, (progress) => {});
                URL.revokeObjectURL(worker_url);
                window._db = db;
                return db;
            }

            async function getConnection() {
                const db = await getDb();
                var conn = await db.connect();
                return conn;
            }

            async function attachDucklake(conn, ducklake_url) {
                await executeQuery(conn, "LOAD httpfs;");
                await executeQuery(conn, "LOAD ducklake;");
                // await executeQuery(conn, "USE memory; DETACH db;");
                await executeQuery(conn, "ATTACH 'ducklake:" + ducklake_url + "' as db; USE db;")
            }

            async function executeQuery(conn, query, setup_queries = "") {
                    var error = null;
                    const startTime = performance.now();
                    var results = await conn.query(setup_queries + query).catch((e) => {error = e; console.log(e);});
                    const runTime = performance.now() - startTime;
                   
                    return {results, error, runTime};
            }

            async function fetch_info(conn, query, display_element, timer_element) {
                    var setup_queries = "";

                    console.log(res);

                    if (res.error !== null) {

                        return    
                    }
                    
                    let results = res.results.toArray().map((row) => row.toJSON());

                    let row_element = document.createElement("tr");
                    Object.keys(results[0]).forEach(key =>{

                            cell.innerHTML = key;

                        });
                    table_element.appendChild(row_element);
                    results.forEach(row => {
                        let row_element = document.createElement("tr")
                        Object.values(row).forEach(value =>{

                            cell.innerHTML = value;
                            row_element.appendChild(cell);
                        })
                        table_element.appendChild(row_element)
                    });
                    results_element.appendChild(table_element)
                    
                    document.getElementById(timer_element).innerHTML = `Took ${(Date.now() - start_time)/1000} s to run.`    
            }
