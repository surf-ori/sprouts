<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="https://unpkg.com/@knadh/oat/oat.min.css">

        <script type="module">
            // This is reusing snippets of code from the DuckDB Iceberg browser (https://duckdb.org/2025/12/16/iceberg-in-the-browser)

            import * as duckdb from "https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@1.33.1-dev36.0/+esm";

            async function getDb() {
                // @ts-ignore
                if (window._db) return window._db;
                const JSDELIVR_BUNDLES = duckdb.getJsDelivrBundles();
            
                // Select a bundle based on browser checks
                const bundle = await duckdb.selectBundle(JSDELIVR_BUNDLES);
            
                const worker_url = URL.createObjectURL(
                    new Blob([`importScripts("${bundle.mainWorker}");`], {
                        type: "text/javascript",
                    })
                );
            
                // Instantiate the asynchronous version of DuckDB-wasm
                const worker = new Worker(worker_url);

                const logger = new duckdb.ConsoleLogger();
                const db = new duckdb.AsyncDuckDB(logger, worker);

                function progressHandler(progress) {
                    var percentage = 100 * progress.bytesLoaded / progress.bytesTotal / 6;
                    if (percentage > 100) percentage = 100;
                    percentage = Math.ceil(percentage);
                        //   document.getElementById("last_query_status").innerHTML = "4/5: Instantiating DuckDB-Wasm - Wasm module, " + percentage + "%";
                }

                await db.instantiate(bundle.mainModule, bundle.pthreadWorker, progressHandler);
                URL.revokeObjectURL(worker_url);
                window._db = db;
                return db;
            }

            async function executeQuery(conn, sql, setup_queries = "") {
                    var error = null;
                    const startTime = performance.now();
                    var results = await conn.query(setup_queries + sql).catch((e) => {error = e; console.log(e);});
                    const runTime = performance.now() - startTime;
                   
                    return {results, error, runTime};
            }

            async function fetch_info(ducklake_url, query, display_element, timer_element) {
                getDb().then(async (db) => {
                        // Create a new connection                
                    var setup_queries = "";
                    let start_time = Date.now();
                    var conn = await db.connect();
                    {
                        await executeQuery(conn, "LOAD httpfs;");
                        await executeQuery(conn, "LOAD ducklake;");
                        await executeQuery(conn, "USE memory; DETACH sprouts;");
                        await executeQuery(conn, "ATTACH 'ducklake:" + ducklake_url + "' as sprouts; USE sprouts;")
                        let res = await executeQuery(conn, query)
                        console.log(res);
                        let results = res.results.toArray().map((row) => row.toJSON());
                        let results_element = document.getElementById(display_element);
                        results_element.innerHTML = ""; //JSON.stringify(res.toArray().map((row) => row.toJSON()));
                        let table_element = document.createElement("table");
                        let row_element = document.createElement("tr");
                        Object.keys(results[0]).forEach(key =>{
                                let cell = document.createElement("th");
                                cell.innerHTML = key;
                                row_element.appendChild(cell);
                            });
                        table_element.appendChild(row_element);
                        results.forEach(row => {
                            let row_element = document.createElement("tr")
                            Object.values(row).forEach(value =>{
                                let cell = document.createElement("td");
                                cell.innerHTML = value;
                                row_element.appendChild(cell);
                            })
                            table_element.appendChild(row_element)
                        });
                        results_element.appendChild(table_element)
                        
                    }
                    document.getElementById(timer_element).innerHTML = `Took ${(Date.now() - start_time)/1000} s to run.`    
                });   
            }

            let connect = document.getElementById("connect")
            let overview_query = "SELECT s.schema_name, t.table_name, ts.record_count\
                                                        FROM __ducklake_metadata_sprouts.ducklake_schema s\
                                                        JOIN __ducklake_metadata_sprouts.ducklake_table t\
                                                        USING (schema_id)\
                                                        JOIN __ducklake_metadata_sprouts.ducklake_table_stats ts\
                                                        USING (table_id)\
                                                        WHERE s.schema_name != 'main';";
            connect.addEventListener("click", e => fetch_info(document.getElementById('ducklake_url').value, overview_query, "overview", "connect_timer"))

            let run = document.getElementById("run")
            run.addEventListener("click", e => fetch_info(document.getElementById('ducklake_url').value, document.getElementById('query').value, "results", "run_timer"))
        </script>
    </head>
    <body>
        <details>
            <summary>Overview</summary>
            <div>
                <input id="ducklake_url" type="text" value="https://objectstore.surf.nl/cea01a7216d64348b7e51e5f3fc1901d:sprouts/catalog.ducklake" style="width: 800px"/>
                <button id="connect">Connect</button><div id="connect_timer"></div>
            </div>

            <div id="overview"></div>
        </details>
        <details>
            <summary>Query</summary>
            <div>
                <input id="query" type="text" value="SELECT * FROM openapc.apc LIMIT 10" style="width: 800px"/>
                <button id="run">Run</button><div id="run_timer"></div>
            </div>

            <div id="results"></div>
        </details>
    </body>
</html>
